name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Image SHA to deploy (ghcr.io/polaeskandar/khmh-koeln-app-backend:<sha>)
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      SHA: ${{ inputs.sha }}
      BASE_URL: ${{ vars.BASE_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }

      - name: Open SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Record the running release
        id: running
        run: |
          running="$(ssh "$DEPLOY_TARGET" 'bash -s -- current' < deploy/release.sh)"
          echo "sha=$running" >> "$GITHUB_OUTPUT"

      - name: Pull the new image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote=(ssh "$DEPLOY_TARGET")
          printf '%s' "$REGISTRY_TOKEN" | "${remote[@]}" "docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null"
          "${remote[@]}" "bash -s -- pull $SHA" < deploy/release.sh
          "${remote[@]}" 'docker logout ghcr.io > /dev/null'

      - name: Migrate
        id: migrate
        run: |
          ssh "$DEPLOY_TARGET" "bash -s -- migrate $SHA" < deploy/release.sh

      - name: Roll out
        run: |
          ssh "$DEPLOY_TARGET" "bash -s -- rollout $SHA" < deploy/release.sh

      - name: Smoke test
        id: smoke
        run: deploy/smoke-test.sh

      - name: Roll back to the recorded release
        if: failure() && steps.running.outputs.sha != '' && steps.running.outputs.sha != inputs.sha
        env:
          PREVIOUS: ${{ steps.running.outputs.sha }}
        run: |
          ssh "$DEPLOY_TARGET" "bash -s -- rollout $PREVIOUS" < deploy/release.sh
          deploy/smoke-test.sh

      - name: Summary
        if: always()
        env:
          RUNNING: ${{ steps.running.outputs.sha }}
          MIGRATE: ${{ steps.migrate.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          JOB: ${{ job.status }}
        run: |
          {
            echo "## Deploy"
            echo "| | |"
            echo "| --- | --- |"
            echo "| Requested | \`$SHA\` |"
            echo "| Running before | \`${RUNNING:-unknown}\` |"
            echo "| Migrations | $MIGRATE |"
            echo "| Smoke test | $SMOKE |"
            echo "| Result | $JOB (a failed smoke test rolls back to the release that ran before) |"
          } >> "$GITHUB_STEP_SUMMARY"
