name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: composer ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: khmk
          POSTGRES_USER: khmk
          POSTGRES_PASSWORD: khmk
        ports:
          - 127.0.0.1:5436:5432
        options: >-
          --health-cmd "pg_isready -d khmk -U khmk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl
          tools: composer:v2
          coverage: none

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - run: composer ci

  image:
    name: image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: khmk
          POSTGRES_USER: khmk
          POSTGRES_PASSWORD: khmk
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -d khmk -U khmk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: ghcr.io/polaeskandar/khmh-koeln-app-backend:${{ github.sha }}
      APP_SECRET: ci-smoke-test-secret-0123456789ab
      DATABASE_URL: postgresql://khmk:khmk@127.0.0.1:5432/khmk?serverVersion=18&charset=utf8
      DEFAULT_URI: https://app.khmk-koeln.com
      MAILER_DSN: null://null
      TRUSTED_PROXIES: ''
      RUN_ENV: -e APP_SECRET -e DATABASE_URL -e DEFAULT_URI -e MAILER_DSN -e TRUSTED_PROXIES
      PSQL: docker run --rm --network host postgres:18-alpine psql postgresql://khmk:khmk@127.0.0.1:5432/khmk -tAc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image refuses to start without its secrets
        run: |
          if docker run --rm "$IMAGE" 2> missing.txt; then exit 1; fi
          grep -q 'APP_SECRET' missing.txt

      - name: The image holds production code only
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test "$(id -u)" != 0 &&
            test ! -e tests && test ! -e vendor/phpunit && test ! -e .env.local && test ! -e .git &&
          test ! -w src && test -w var &&
          test -f templates/emails/password_link.html.twig && test -f translations/emails.en.yaml &&
          test "$(php -r "echo ini_get(\"zend.assertions\");")" = -1 &&
            php bin/console about | grep -Eq "Environment +prod" &&
            php bin/console about | grep -Eq "Debug +false"'
          docker inspect "$IMAGE" --format '{{json .Config.Healthcheck}}' | grep -q 'api/health'

      - name: Starting leaves an empty database empty
        run: |
          docker run -d --name api --network host $RUN_ENV "$IMAGE"
          sleep 5
          test "$($PSQL "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog', 'information_schema')")" = 0

      - name: Migrate as a one-off command
        run: docker run --rm --network host $RUN_ENV "$IMAGE" php bin/console app:migrations:migrate --no-interaction

      - name: The API answers
        run: |
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS -D headers.txt http://127.0.0.1:8080/api/health/ready
          if grep -qi '^x-powered-by' headers.txt; then exit 1; fi

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
