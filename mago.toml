[[guard.perimeter.restrictions]]
dependency = "App\\Context\\*\\{*,Application\\**,Infrastructure\\**,Domain\\*}"
deny-from = ["App\\Interface\\**"]
reason = "Interface reaches the contexts through workflows; of a context it names only the enums in Domain\\Enum."

[[guard.perimeter.restrictions]]
dependency = "App\\Context\\*\\Domain\\{Attribute,Entity,Exception,Interface,Query,Repository,Validation,ValueObject}\\**"
deny-from = ["App\\Interface\\**"]
reason = "Interface reaches the contexts through workflows; of a context it names only the enums in Domain\\Enum."

