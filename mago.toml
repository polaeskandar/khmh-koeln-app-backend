[[guard.perimeter.restrictions]]
dependency = "App\\Interface\\**"
allow-from = ["App\\Interface\\**", "App\\Tests\\**"]
reason = "Interface holds entry points, requests and responses; nothing depends on it."

[[guard.perimeter.restrictions]]
dependency = "App\\Workflow\\**"
allow-from = ["App\\Interface\\**", "App\\Workflow\\**", "App\\Tests\\**"]
reason = "Interface calls workflows; the contexts never depend on them."

[[guard.perimeter.restrictions]]
dependency = "App\\Platform\\**"
deny-from = ["App\\Context\\*\\Domain\\**", "App\\Library\\**"]
reason = "The domain model is independent of the runtime; library code is reusable outside this application."

[[guard.perimeter.restrictions]]
dependency = "App\\Platform\\*\\Service\\**"
allow-from = ["App\\Platform\\**", "App\\Tests\\**", "@global"]
reason = "Outside the platform, code relies on platform contracts, not on how they are implemented."

[[guard.perimeter.restrictions]]
dependency = "App\\Platform\\*\\Command\\**"
allow-from = ["App\\Platform\\**", "App\\Tests\\**"]
reason = "Platform commands are entry points, not dependencies."

[[guard.perimeter.restrictions]]
dependency = "App\\Context\\*\\Application\\Service\\**"
deny-from = ["App\\Workflow\\*\\Model\\**"]
reason = "A workflow model is built from values; only the workflow calls the contexts' services."

[[guard.perimeter.restrictions]]
dependency = "App\\Context\\*\\Domain\\Query\\**"
deny-from = ["App\\Workflow\\*\\Model\\**"]
reason = "A workflow model is built from values; only the workflow reads through the contexts' query interfaces."

[[guard.perimeter.restrictions]]
dependency = "App\\Library\\*\\Client\\**"
deny-from = ["App\\Workflow\\*\\Model\\**"]
reason = "A workflow model is built from values; the workflow asks clients such as the Calendar."

[[guard.perimeter.restrictions]]
dependency = "App\\Context\\*\\{Application\\**,Infrastructure\\**,Domain\\Repository\\**,Domain\\Query\\**,Domain\\Interface\\**}"
deny-from = ["App\\Context\\*\\Domain\\Validation\\**"]
reason = "A domain rule is pure: the application service loads the facts and hands them over."

[[guard.perimeter.restrictions]]
dependency = "App\\Context\\Identity\\Application\\Service\\AccessCheck"
allow-from = ["App\\Workflow\\*", "App\\Tests\\**"]
reason = "Workflows manage access; models, controllers and context services never check it."

[[guard.perimeter.restrictions]]
dependency = "Symfony\\Component\\Workflow\\**"
allow-from = ["App\\Context\\*\\Application\\Service", "App\\Context\\*\\Infrastructure\\Lifecycle\\**", "App\\Platform\\Lifecycle\\**", "App\\Tests\\**"]
reason = "A subject's lifecycle service applies its state machine; its marking store and guards plug into it."

[[guard.structural.rules]]
on = "App\\Context\\*\\Infrastructure\\Persistence\\Repository\\*"
target = "class"
must-be-named = "Doctrine*Repository"
must-be-final = true
must-be-readonly = true
reason = "The Repository folder holds the Doctrine repositories; their query filters live in Repository/Filter."

[[guard.structural.rules]]
on = "App\\Context\\*\\Infrastructure\\Persistence\\Repository\\Filter\\**"
must-be = ["class"]
must-be-named = "*Filters"
must-be-final = true
must-be-readonly = true
reason = "A repository filter builds the Doctrine criteria for one entity's listings."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Repository\\**"
must-be = ["interface"]
must-be-named = "*RepositoryInterface"
reason = "A repository is a contract that infrastructure implements."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Query\\**"
must-be = ["interface"]
must-be-named = "*QueryInterface"
reason = "A query interface lists the reads a workflow may make; the context's Doctrine repository implements it."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Exception\\**"
target = "class"
must-be-named = "*Exception"
reason = "Exceptions live in the context whose rule they express and carry the Exception suffix."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\ValueObject\\**"
target = "class"
must-be-final = true
must-be-readonly = true
reason = "A value object is immutable."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Validation\\**"
must-be = ["class"]
must-be-named = "*Rule"
must-be-final = true
must-be-readonly = true
reason = "A domain rule is named <Rule>Rule and checks the values and entities it is given with ensure…() methods."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Enum\\**"
must-be = ["enum"]
reason = "The Enum folder holds only enums."

[[guard.structural.rules]]
on = "App\\Context\\*\\Application\\Service\\**"
must-be = ["class"]
must-be-final = true
must-be-readonly = true
reason = "An application service holds only its injected collaborators."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Interface\\**"
must-be = ["interface"]
must-be-named = "*Interface"
reason = "A port is a contract the context's infrastructure implements and carries the Interface suffix."

[[guard.structural.rules]]
on = "App\\Context\\*\\Domain\\Attribute\\**"
target = "class"
must-be-final = true
must-be-readonly = true
reason = "An attribute is immutable metadata of the domain."

[[guard.structural.rules]]
on = "App\\Workflow\\*\\*"
target = "class"
must-be-named = "*Workflow"
must-be-final = true
must-be-readonly = true
reason = "A workflow is named <Verb><Subject>Workflow and holds only injected collaborators."

[[guard.structural.rules]]
on = "App\\Workflow\\*\\Model\\**"
target = "class"
must-be-final = true
must-be-readonly = true
reason = "A workflow model is an immutable value."

[[guard.structural.rules]]
on = "App\\Interface\\Api\\*\\*"
target = "class"
must-be-named = "*Controller"
must-be-final = true
reason = "API entry points are controllers."

[[guard.structural.rules]]
on = "App\\Interface\\Api\\*\\Request\\**"
target = "class"
must-be-named = "*Request"
must-be-final = true
must-be-readonly = true
reason = "A request is the immutable payload an endpoint accepts."

[[guard.structural.rules]]
on = "App\\Interface\\Api\\*\\Response\\**"
target = "class"
must-be-named = "*Response"
must-be-final = true
must-be-readonly = true
reason = "A response is the immutable shape an endpoint answers with."

[[guard.structural.rules]]
on = "App\\Interface\\Console\\*\\*"
target = "class"
must-be-named = "*Command"
must-be-final = true
reason = "Console entry points are commands."

[[guard.structural.rules]]
on = "App\\Interface\\Console\\*\\Request\\**"
target = "class"
must-be-named = "*Request"
must-be-final = true
reason = "A console request is the #[MapInput] object Symfony fills from a command's arguments and options."

[[guard.structural.rules]]
on = "App\\Library\\*\\Model\\**"
target = "class"
must-be-final = true
must-be-readonly = true
reason = "A library model is an immutable value."

[[guard.structural.rules]]
on = "App\\Library\\*\\Mapping\\**"
target = "class"
must-be-abstract = true
reason = "A library mapping is a Doctrine mapped superclass that entities extend."

[[guard.structural.rules]]
on = "App\\Library\\*\\Client\\**"
target = "class"
must-be-final = true
must-be-readonly = true
reason = "A library client holds only its injected collaborators."

[[guard.structural.rules]]
on = "App\\Platform\\*\\Contract\\**"
must-be = ["interface"]
reason = "A platform contract is an interface the rest of the application may use."

[[guard.structural.rules]]
on = "App\\Platform\\*\\Command\\**"
target = "class"
must-be-named = "*Command"
must-be-final = true
reason = "Platform console commands are named *Command."

[[guard.perimeter.restrictions]]
dependency = "**"
kinds = ["function"]
allow-from = ["App\\Library\\**", "App\\Tests\\**", "App\\Tools\\**", "@global"]
reason = "PHP native functions are wrapped once in a Library model; the rest of the application calls the model."
