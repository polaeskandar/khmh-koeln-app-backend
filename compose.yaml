# Local infrastructure for development. The API runs natively (see README.md);
# only PostgreSQL is containerized.
name: khmk-koeln

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: khmk
      POSTGRES_USER: khmk
      # Local development only. Real credentials never live in this file.
      POSTGRES_PASSWORD: khmk
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "khmk", "-U", "khmk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  database_data:
