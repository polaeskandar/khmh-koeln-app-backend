services:
    _defaults:
        autowire: true

    App\Tests\Support\Platform\Problem\:
        resource: '../tests/Support/Platform/Problem/*ProbeController.php'
        tags: [controller.service_arguments]

    App\Library\Time\Client\Calendar:
        public: true

    App\Context\Learning\Application\Service\LessonMeetings:
        public: true

    App\Context\Scheduling\Application\Service\MeetingLookup:
        public: true

    App\Tests\Support\Platform\Errors\RecordingTransport:
        public: true

    App\Tests\Support\Context\Identity\Infrastructure\Security\SessionProbeController:
        tags: [controller.service_arguments]

    App\Tests\Support\Context\Access\Application\Service\AccessProbeController:
        tags: [controller.service_arguments]

    App\Tests\Support\Context\Identity\Application\Service\MemberProbeController:
        tags: [controller.service_arguments]

    App\Tests\Support\Context\Identity\Infrastructure\Security\SpyPasswordHasherFactory:
        decorates: security.password_hasher_factory
        arguments: ['@.inner']
        public: true

    app.test.rate_limits:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
