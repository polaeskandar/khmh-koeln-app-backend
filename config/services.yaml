# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.time_zone: 'Europe/Berlin'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Platform/Kernel/Service/Kernel.php'
            - '../src/Context/*/Domain/Entity/'
            - '../src/Context/*/Domain/ValueObject/'
            - '../src/Context/*/Infrastructure/Persistence/Migrations/'
