nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: []
        allow_credentials: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type']
        expose_headers: ['Retry-After']
        max_age: 3600
    paths:
        '^/api/': null
