framework:
    rate_limiter:
        sign_in_account:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        sign_in_client:
            policy: fixed_window
            limit: 25
            interval: '15 minutes'
        registration:
            policy: fixed_window
            limit: 20
            interval: '1 hour'
        password_link:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        password_change:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        forgot_password_client:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        forgot_password_email:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        registration_email:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        email_confirmation:
            policy: fixed_window
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            sign_in_account:
                storage_service: app.test.rate_limits
            sign_in_client:
                storage_service: app.test.rate_limits
            registration:
                storage_service: app.test.rate_limits
            password_link:
                storage_service: app.test.rate_limits
            password_change:
                storage_service: app.test.rate_limits
            forgot_password_client:
                storage_service: app.test.rate_limits
            forgot_password_email:
                storage_service: app.test.rate_limits
            registration_email:
                storage_service: app.test.rate_limits
            email_confirmation:
                storage_service: app.test.rate_limits
