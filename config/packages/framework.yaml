framework:
    exceptions:
        App\Library\Problem\Exception\RuleViolation: { log_level: info }
        App\Library\Problem\Exception\NotFound: { log_level: info }
        App\Library\Problem\Exception\InvalidInput: { log_level: info }
        Doctrine\DBAL\Exception\UniqueConstraintViolationException: { log_level: info }
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    session:
        handler_id: '%env(DATABASE_URL)%'
        name: khmk_session
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: '%env(int:SESSION_LIFETIME)%'
        gc_maxlifetime: '%env(int:SESSION_LIFETIME)%'

when@dev:
    framework:
        session:
            cookie_secure: auto

when@prod:
    framework:
        session:
            name: __Host-khmk_session

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
