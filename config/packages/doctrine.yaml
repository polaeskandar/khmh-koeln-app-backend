doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        options:
            !php/const PDO::ATTR_TIMEOUT: 2

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            local_date: App\Platform\Doctrine\Service\LocalDateType
            local_time: App\Platform\Doctrine\Service\LocalTimeType
    orm:
        enable_native_lazy_objects: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Persistence:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Library/Persistence/Mapping'
                prefix: 'App\Library\Persistence\Mapping'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Context/Identity/Domain'
                prefix: 'App\Context\Identity\Domain'
            Organization:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Context/Organization/Domain'
                prefix: 'App\Context\Organization\Domain'
            People:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Context/People/Domain'
                prefix: 'App\Context\People\Domain'
            Scheduling:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Context/Scheduling/Domain'
                prefix: 'App\Context\Scheduling\Domain'
            Learning:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Context/Learning/Domain'
                prefix: 'App\Context\Learning\Domain'
            Privacy:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Context/Privacy/Domain'
                prefix: 'App\Context\Privacy\Domain'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
