security:
    password_hashers:
        App\Context\Identity\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        accounts:
            id: App\Context\Identity\Infrastructure\Security\AccountProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)
            security: false
        api_token_issue:
            pattern: ^/api/auth/tokens$
            methods: [POST]
            stateless: true
            provider: accounts
            login_throttling:
                limiter: App\Context\Identity\Infrastructure\Security\SignInRateLimiter
            json_login:
                check_path: api_auth_tokens
                username_path: username
                password_path: password
                success_handler: App\Context\Identity\Infrastructure\Security\ApiTokenIssuer
        api_bearer:
            request_matcher: App\Platform\Http\Service\BearerRequests
            stateless: true
            provider: accounts
            access_token:
                token_handler: App\Context\Identity\Infrastructure\Security\ApiTokenHandler
                token_extractors: App\Platform\Http\Service\BearerTokenExtractor
        api:
            pattern: ^/api
            lazy: true
            provider: accounts
            login_throttling:
                limiter: App\Context\Identity\Infrastructure\Security\SignInRateLimiter
            json_login:
                check_path: api_auth_sign_in
                username_path: username
                password_path: password
            logout:
                path: api_auth_sign_out

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/openapi\.json$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/tokens/current, roles: IS_AUTHENTICATED }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/test/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            App\Context\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
