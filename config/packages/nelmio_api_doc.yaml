nelmio_api_doc:
    documentation:
        openapi: 3.1.0
        info:
            title: KHMK Köln API
            description: Generated from the routes and request models. The agreed contract is docs/api.md.
            version: 1.0.0
        components:
            schemas:
                Liveness:
                    type: object
                    required: [status]
                    properties:
                        status: { type: string, enum: [ok] }
                Problem:
                    type: object
                    required: [status, code, params]
                    properties:
                        status: { type: integer }
                        code: { type: string }
                        params: { type: object }
                        fieldErrors:
                            type: object
                            additionalProperties:
                                type: object
                                required: [code, params]
                                properties:
                                    code: { type: string }
                                    params: { type: object }
            responses:
                Problem:
                    description: A problem with a stable code (docs/api.md, Problems).
                    content:
                        application/problem+json:
                            schema: { $ref: '#/components/schemas/Problem' }
            securitySchemes:
                session:
                    type: apiKey
                    in: cookie
                    name: __Host-khmk_session
        security:
            - session: []
    areas:
        default:
            path_patterns:
                - ^/api(?!/test)
