framework:
    workflows:
        data_request_lifecycle:
            type: state_machine
            supports: App\Context\Privacy\Domain\Entity\DataRequest
            marking_store:
                service: App\Context\Privacy\Infrastructure\Lifecycle\DataRequestMarkingStore
            events_to_dispatch: []
            initial_marking: open
            places: App\Context\Privacy\Domain\Enum\RequestStatus::*
            transitions:
                complete:
                    from: open
                    to: done
                    metadata:
                        refusals:
                            done: privacy.notOpen
                            withdrawn: privacy.notOpen
                            declined: privacy.notOpen
                withdraw:
                    from: open
                    to: withdrawn
                    metadata:
                        refusals:
                            done: privacy.nothingScheduled
                            withdrawn: privacy.nothingScheduled
                            declined: privacy.nothingScheduled
        homework_lifecycle:
            type: state_machine
            supports: App\Context\Learning\Domain\Entity\HomeworkAssignment
            marking_store:
                service: App\Context\Learning\Infrastructure\Lifecycle\HomeworkMarkingStore
            events_to_dispatch: []
            initial_marking: draft
            places: App\Context\Learning\Domain\Enum\HomeworkStatus::*
            transitions:
                publish:
                    from: [draft, published]
                    to: published
                    metadata:
                        refusals:
                            archived: homework.archivedNoPublish
                unpublish:
                    from: published
                    to: draft
                    metadata:
                        refusals:
                            draft: homework.onlyPublishedBack
                            archived: homework.onlyPublishedBack
                archive:
                    from: [draft, published, archived]
                    to: archived
                restore_as_draft:
                    from: archived
                    to: draft
                    metadata:
                        refusals:
                            draft: homework.notArchived
                            published: homework.notArchived
                restore_as_published:
                    from: archived
                    to: published
                    metadata:
                        refusals:
                            draft: homework.notArchived
                            published: homework.notArchived
        session_lifecycle:
            type: state_machine
            supports: App\Context\Meetings\Domain\Entity\Session
            marking_store:
                service: App\Context\Meetings\Infrastructure\Lifecycle\SessionMarkingStore
            events_to_dispatch: []
            initial_marking: scheduled
            places: App\Context\Meetings\Domain\Enum\SessionStatus::*
            transitions:
                open:
                    from: [scheduled, active]
                    to: active
                    metadata:
                        refusals:
                            completed: meetings.attendanceClosed
                            canceled: meetings.sessionCanceled
                close:
                    from: [active, completed]
                    to: completed
                    metadata:
                        refusals:
                            scheduled: meetings.onlyActiveCanClose
                            canceled: meetings.onlyActiveCanClose
                reopen:
                    from: [completed, active]
                    to: active
                    metadata:
                        refusals:
                            scheduled: meetings.onlyCompletedCanReopen
                            canceled: meetings.onlyCompletedCanReopen
                cancel:
                    from: scheduled
                    to: canceled
                    metadata:
                        refusals:
                            active: meetings.onlyScheduledCanCancel
                            completed: meetings.onlyScheduledCanCancel
                            canceled: meetings.onlyScheduledCanCancel
